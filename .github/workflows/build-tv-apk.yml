name: Build SmartStay Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prod
    paths:
      - 'packages/tv-android/**'
      - '.github/workflows/build-tv-apk.yml'

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK with Cloud Backend
        working-directory: packages/tv-android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PBACKEND_URL="https://hotel-tv-management.onrender.com"

      - name: Verify Generated APK
        working-directory: packages/tv-android
        run: |
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstay-tv-apk
          path: packages/tv-android/app/build/outputs/apk/release/*.apk
          retention-days: 14
