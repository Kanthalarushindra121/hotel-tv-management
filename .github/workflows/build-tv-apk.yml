name: Build SmartStay Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prod

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Android 34 Platform & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK with Cloud Backend
        working-directory: packages/tv-android
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace \
            -PBACKEND_URL="https://hotel-tv-management.onrender.com"

      - name: Verify Generated APKs
        working-directory: packages/tv-android
        run: |
          echo "=== RELEASE APK ==="
          ls -lh app/build/outputs/apk/release/ || true
          echo "=== DEBUG APK ==="
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstay-tv-apk
          path: |
            packages/tv-android/app/build/outputs/apk/release/*.apk
            packages/tv-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
