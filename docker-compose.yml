version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartstay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartstay
      POSTGRES_USER: smartstay
      POSTGRES_PASSWORD: smartstay_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartstay" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartstay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: smartstay_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://smartstay:smartstay_dev_password@postgres:5432/smartstay?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://192.168.29.219:3000
    env_file:
      - ./packages/backend/.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/backend/uploads:/app/uploads

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: smartstay_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.29.219:4000/api/v1
      - NEXT_PUBLIC_SOCKET_URL=http://192.168.29.219:4000
    env_file:
      - ./packages/web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
